# =====================================================
# NahSehat AdBrief Dashboard — Cloud Run Backend Env Vars
# =====================================================
# DIPAKAI OLEH: deploy-all.sh → gcloud run deploy --env-vars-file
#
# ⚠️  FILE INI BERISI SECRETS — sudah di-gitignore (lihat .gitignore line 14).
#     JANGAN commit ke repo.
#
# Sumber nilai: server/.env (local dev config) — sama untuk Cloud Run
# karena backend connect ke Cloud SQL via public IP TCP.
#
# Format: YAML flat key: 'value' — gcloud --env-vars-file hanya
# menerima flat map (tidak ada nesting).
# =====================================================

# ─── APPLICATION ─────────────────────────────────────
NODE_ENV: 'production'
# PORT tidak perlu di-set — Cloud Run inject PORT=8080 otomatis.

# ─── DATABASE (Cloud SQL TCP public IP) ──────────────
DB_HOST: '10.250.16.5'
DB_PORT: '3306'
DB_USER: 'bashir'
DB_PASSWORD: '0xEp8duI*iL(kLJ&'
DB_NAME: 'nahsehat_analytics_dash'
# DB_SOCKET_PATH tidak di-set → backend pakai mode TCP.
# Cloud SQL public IP mewajibkan SSL — aktifkan:
DB_SSL: 'true'
#
# FIX "unable to verify the first certificate" (HANDSHAKE_SSL_ERROR):
# Server MySQL memakai self-signed cert / CA internal yang tidak dikenal
# Node.js. Sediakan CA-nya lewat salah satu opsi di bawah (pilih SATU):
#
# Opsi A (aman — verifikasi penuh): isi CA server MySQL (PEM).
#   Ambil dari DBA/infra, atau dari datadir MySQL server (ca.pem),
#   atau Cloud SQL: gcloud sql instances describe <INSTANCE> \
#     --project=project-digital-admedika --format='value(serverCaCert.cert)'
#   Newline di PEM diganti literal \n (env var satu baris):
# DB_SSL_CA: '-----BEGIN CERTIFICATE-----\nMIIF...\n-----END CERTIFICATE-----'
#
# ⚠️ Jika DB_SSL=true TANPA DB_SSL_CA/DB_SSL_CA_PATH, handshake akan tetap
#    gagal seperti sekarang ("unable to verify the first certificate").
#
# Opsi B: path file CA yang di-bake/mount ke dalam container, contoh
#   (tambahkan di server/Dockerfile: COPY mysql-ca.pem /app/certs/mysql-ca.pem):
# DB_SSL_CA_PATH: '/app/certs/mysql-ca.pem'
#
# Opsi C (CEPAT, kurang aman — tanpa verifikasi cert, tetap terenkripsi):
#   Ganti DB_SSL di atas menjadi: DB_SSL: 'no-verify'

# ─── JWT AUTHENTICATION ──────────────────────────────
JWT_SECRET: '5Sg9Sk4l3RPC0rCdwucMH/SO43+sRpo1xon5wRdW1x71CNJw8i7a52+jtTgwsIvw'
JWT_EXPIRES_IN: '24h'

# ─── 2FA ENCRYPTION KEY (AES-256-GCM, wajib ≥32 char) ─
TWO_FACTOR_ENCRYPTION_KEY: '+4znlfVZWQszYR8WOGeo+wQKCasskzNQAnKQHq0veEKeyXxPrvOQti+RAMcRkPts'

# ─── CORS ────────────────────────────────────────────
# deploy-all.sh akan auto-append URL frontend Cloud Run setelah deploy.
# CORS_ALLOW_CLOUD_RUN=false di production (deploy script memaksa ini).
CORS_ORIGIN: 'http://localhost:5173'
CORS_ALLOW_CLOUD_RUN: 'false'