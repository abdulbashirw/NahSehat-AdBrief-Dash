# SECURITY (P2.5): listen on 8080 so the container can run unprivileged
# (nginxinc/nginx-unprivileged) — ports <1024 require root.
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ─── Security headers (P2.4) ───────────────────────────────────────
    # CSP notes:
    #  - style-src 'unsafe-inline' is required: React/framer-motion set inline
    #    style attributes; Google Fonts CSS is loaded from fonts.googleapis.com.
    #  - connect-src https://*.run.app covers the backend + external APIs
    #    (repi-api / repi2-server-dev on Cloud Run). NARROW THIS if the set of
    #    API hosts becomes fixed — replace with explicit hostnames.
    #  - X-XSS-Protection removed (deprecated; no-op in modern browsers).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.run.app; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Cache static assets
    # NOTE: add_header directives are NOT inherited once a location defines
    # its own — repeat the security headers here so asset responses carry them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.run.app; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — DISABLED for Cloud Run.
    # On Cloud Run, each service has its own URL. The frontend calls the backend
    # directly using VITE_BE_API (set at build time via Docker build args).
    # The old `proxy_pass http://backend:8080/` would crash nginx because the
    # `backend` hostname cannot be resolved outside a shared Docker network.
    #
    # For docker-compose with a backend service, add a proxy block here:
    #   location /api/ {
    #       proxy_pass http://backend:8080/;
    #       proxy_set_header Host $host;
    #       proxy_set_header X-Real-IP $remote_addr;
    #       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #       proxy_set_header X-Forwarded-Proto $scheme;
    #   }

    # Health check endpoint
    # (own add_header set → security headers not inherited here; fine —
    # this endpoint returns a plain OK string, not a document)
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}